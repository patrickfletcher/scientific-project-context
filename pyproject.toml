[build-system]
requires = ["hatchling>=1.19,<2"]
build-backend = "hatchling.build"

[project]
name = "scientific-project-context"
version = "0.1.0.dev22"
description = "Maintained context for understandable and verifiable scientific projects"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Fletcher" }]
keywords = ["agents", "context", "documentation", "reproducibility", "research-software"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/patrickfletcher/scientific-project-context"
Source = "https://github.com/patrickfletcher/scientific-project-context"
Issues = "https://github.com/patrickfletcher/scientific-project-context/issues"

[project.scripts]
spctx = "scientific_project_context.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_project_context"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "_scientific_project_context_resources/template"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/template",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
